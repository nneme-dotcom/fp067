<app-header />

<main class="container py-4">
  <div class="row g-4">
    <!-- Izquierda: la lista de jugadoras con el buscador -->
    <div class="col-md-5">
      <app-players
        [selectedId]="selectedPlayer()?.id ?? null"
        (playerSelected)="onPlayerSelected($event)"
      />
    </div>

    <!-- Derecha: la ficha y el vídeo (solo aparecen cuando eliges a alguien) -->
    <div class="col-md-7 player-zone" id="player-zone" [class.is-empty]="!selectedPlayer()">
      @if (selectedPlayer(); as player) {
        <!-- Arriba el nombre; abajo el vídeo y los datos, uno al lado del otro -->
        <div class="player-view">
          <!-- Fondo compartido para que vídeo y datos se vean como un solo bloque -->
          <div class="card shadow-sm player-body" aria-hidden="true"></div>
          <app-detail [player]="player" (closed)="onDetailClosed()" />
          <app-media class="player-media" [player]="player" />
        </div>
      } @else {
        <!-- En el móvil no lo mostramos: ahí la lista ya ocupa toda la pantalla -->
        <div class="card empty-state h-100 d-none d-md-flex">
          <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-5">
            <app-eagle-flight class="empty-eagle mb-3" />
            <h2 class="section-title mb-0">Select a player</h2>
          </div>
        </div>
      }
    </div>
  </div>
</main>
