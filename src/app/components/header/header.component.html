<header class="eagles-header">
  <div class="container d-flex flex-wrap align-items-center gap-3 py-4">
    <div class="me-auto">
      <!-- El logo del club hace de título; el nombre escrito queda para lectores de pantalla y Google -->
      <h1 class="mb-0">
        <img class="text-logo" src="assets/club/text-logo-white.webp" [alt]="teamName" width="350" height="63" />
      </h1>
    </div>

    <!-- El lema, con el águila del club de fondo -->
    <div class="slogan-wrap" aria-hidden="true">
      <img class="header-eagle" src="assets/club/eagle-white.webp" alt="" width="240" height="240" />
      <span class="slogan slanted">{{ slogan }}</span>
    </div>
  </div>
</header>
